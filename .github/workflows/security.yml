name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal && rustup default 1.93.0
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Inactive RSA advisory exception remains outside the build graph
        run: test -z "$(cargo tree -i rsa --workspace)"
      - run: cargo audit --deny warnings
