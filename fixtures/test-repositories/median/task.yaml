# Forge smoke-test task.
#
# The repository ships with failing tests and an unimplemented function. A
# passing run therefore requires the agent to have done real work: Forge runs
# `cargo test` itself, and an unchanged repository cannot pass.

task_id: T-0001
repository: median
objective: >-
  Implement the `median` function in src/lib.rs so that it returns the median of
  the given values, averaging the middle two when the count is even, and None
  when there are no values.

constraints:
  - The existing tests must pass unmodified
  - The public signature of `median` must not change
  - No new dependencies may be added

protected_paths:
  - tests/**

evaluation:
  tests:
    command: cargo test
    timeout_secs: 300
  lint:
    command: cargo clippy -- -D warnings
    timeout_secs: 300
  security:
    command: "! grep -R -n 'unsafe' src"
  complexity:
    command: >-
      branches=$(grep -Eoc 'if |match |for |while ' src/lib.rs || true);
      printf '{"metrics":{"branch_points":{"value":%s,"unit":"points","direction":"minimize"}}}'
      "$branches" > .forge-complexity.json
    metrics_file: .forge-complexity.json
  benchmark:
    command: >-
      cases=$(grep -c '^#\[test\]' tests/median.rs);
      printf '{"metrics":{"covered_cases":{"value":%s,"unit":"cases","direction":"maximize"}}}'
      "$cases" > .forge-benchmark.json
    metrics_file: .forge-benchmark.json
  custom:
    - id: public_api
      command: "grep -Fq 'pub fn median(values: &mut [f64]) -> Option<f64>' src/lib.rs"

metadata:
  task_type: implementation
  language: rust
  subsystem: core
