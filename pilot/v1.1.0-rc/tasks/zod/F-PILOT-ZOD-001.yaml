task_id: F-PILOT-ZOD-001
repository: zod
objective: >-
  Support JSON Schema uniqueItems=true in fromJSONSchema using JSON-value
  structural equality. Duplicate objects must be detected regardless of key
  insertion order, primitives must behave correctly, and distinct values must
  not collide.
constraints:
  - Follow AGENTS.md and use the existing from-json-schema test file
  - Evaluate runtime, memory, and bundle-size impact in the terminal report
  - Do not bump versions or add dependencies
protected_paths: ["pnpm-lock.yaml", "LICENSE", ".github/**", "AGENTS.md"]
evaluation:
  tests: { command: "pnpm install --frozen-lockfile --ignore-scripts --store-dir .pnpm-store && pnpm vitest run packages/zod/src/v4/classic/tests/from-json-schema.test.ts", timeout_secs: 1200 }
  lint: { command: "pnpm biome check packages/zod/src/v4/classic/from-json-schema.ts packages/zod/src/v4/classic/tests/from-json-schema.test.ts", timeout_secs: 1200 }
classification: { category: feature, language: typescript, domain: json-schema, difficulty: medium }
components: ["packages/zod/src/v4/classic/from-json-schema.ts"]
tags: ["pilot-v1.1.0-rc", "json-schema"]
