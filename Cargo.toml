[workspace]
resolver = "3"
members = ["crates/*"]
# Fixture repositories are standalone projects used as run targets, not
# members of this workspace.
exclude = ["fixtures"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
forge-core = { path = "crates/forge-core" }
forge-agent = { path = "crates/forge-agent" }
forge-git = { path = "crates/forge-git" }
forge-health = { path = "crates/forge-health" }
forge-policy = { path = "crates/forge-policy" }
forge-executor = { path = "crates/forge-executor" }
forge-eval = { path = "crates/forge-eval" }
forge-runner = { path = "crates/forge-runner" }
forge-router = { path = "crates/forge-router" }
forge-store = { path = "crates/forge-store" }
forge-team = { path = "crates/forge-team" }
forge-world = { path = "crates/forge-world" }

anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
globset = "0.4"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "time",
    "sync",
    "io-util",
] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
] }

[profile.release]
lto = "thin"
